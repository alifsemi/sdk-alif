# Video capture pool. SZ_MAX is the per-buffer max size (one RGB565 480x272
# frame = 261120 bytes, plus k_heap bookkeeping); NUM_MAX is the buffer count.
# The pool reserves NUM_MAX x SZ_MAX, so this is 2 x ~256K = ~512K. Two buffers
# are needed so the LP-CAM driver keeps one armed while the other is streamed
# over USB, avoiding a per-frame sensor power-cycle (see N_CAPTURE_BUFFERS in
# main.c). Lives in the NON_SECURE0 region (.overlay), which has room (768K).
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=262656
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
