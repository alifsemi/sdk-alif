# Extra Kconfig for the E8 DK dual OV5675 build. Pass with EXTRA_CONF_FILE
# alongside the dual OV5675 DTC overlay (see README). The E8 board .conf (ISP
# lib + scaler + JPEG) is applied automatically by board name and still holds.

# Video buffer pool for the dual OV5675 pipeline. The two sensors share the
# capture pipeline and are captured one frame at a time, so one NV12 1024x768
# capture buffer (1,179,648 B) is enough; each camera has its own JPEG output
# buffer (2 x 786,432 B) so one frame can be streamed over USB while the other
# camera captures. That is three allocations totalling ~2.75 MB, so NUM_MAX
# must be >= 3. SZ_MAX x NUM_MAX is the total heap: 1,150,000 x 3 = 3.45 MB
# holds all three with headroom and fits SRAM0 (4 MB).
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=1150000
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3

# The D-PHY driver logs every camera switch at info level; switching happens on
# every frame here.
CONFIG_MIPI_DPHY_LOG_LEVEL_WRN=y
