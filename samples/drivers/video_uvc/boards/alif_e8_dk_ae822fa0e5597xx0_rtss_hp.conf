# E8 DK (RTSS-HP): MIPI CSI-2 sensor -> ISP -> JPEG encoder -> MJPEG over UVC.
#
# Applied automatically by board name for every E8 DK build (alongside the
# common board overlay of the same name), this holds the config shared by all
# three sensors (ARX3A0 / MT9M114 / OV5675). The chosen sensor's overlay is
# merged on top with EXTRA_DTC_OVERLAY_FILE and its per-sensor .conf
# (arx3a0.conf / mt9m114.conf / ov5675.conf, which size the video buffer pool
# for that sensor's resolution) is passed with OVERLAY_CONFIG - there is no
# default sensor. See the README.

# Camera controller extended features (CSI-2 / ISP forwarding path).
CONFIG_VIDEO_ALIF_CAM_EXTENDED=y
CONFIG_MIPI_DSI=y

# Alif ISP (vsi_isp_pico) processing library. Demosaic + scaler are enough to
# turn the sensor's RAW10 Bayer into NV12; colour-correction / white-balance
# modules are left off to keep it lean.
CONFIG_USE_ALIF_ISP_LIB=y
CONFIG_ISP_LIB_SCALAR_MODULE=y
CONFIG_ISP_LIB_DMSC_MODULE=y
CONFIG_ISP_LIB_CCM_MODULE=n
CONFIG_ISP_LIB_WBM_MODULE=n
CONFIG_ISP_LIB_WB_MODULE=n

# Hantro VC9000E JPEG hardware encoder + its software helper library.
CONFIG_VIDEO_JPEG_HANTRO_VC9000E=y
CONFIG_USE_ALIF_JPEG_SW_LIB=y
