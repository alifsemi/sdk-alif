# Extra Kconfig for the E8 DK ARX3A0 build. Pass with OVERLAY_CONFIG alongside
# the ARX3A0 DTC overlay (see README). The E8 board .conf (ISP lib + JPEG) is
# applied automatically by board name and still holds; this file only sizes the
# video buffer pool for the ARX3A0 pipeline.

# Video buffer pool for the 560x560 ARX3A0 pipeline. The pool holds TWO NV12
# 560x560 frames (2 x 560*560*1.5 = 940,800 B - two are needed so the ISP keeps
# capturing while one frame is JPEG-encoded and sent) plus one JPEG output
# buffer (width*height = 313,600 B), three allocations totalling ~1.25 MB.
# NUM_MAX is the buffer count (must be >= 3); SZ_MAX x NUM_MAX is the heap
# total, 470,000 x 3 = 1.41 MB, comfortably within SRAM0.
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=470000
