# Video
CONFIG_VIDEO=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_I2C=y
CONFIG_I2C_DW_CLOCK_SPEED=100
CONFIG_SYS_HEAP_AUTO=y

# USB device stack (new stack, required for DWC3) with the in-tree USB Video
# Class. The webcam is the "uvc" devicetree node (compatible zephyr,uvc-device)
# and streams from the connected video device (LP-CAM RGB565, or the JPEG
# encoder's MJPEG output on the E8).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_VIDEO_CLASS=y
CONFIG_SAMPLE_USBD_PID=0x0009
CONFIG_SAMPLE_USBD_PRODUCT="Alif UVC Video Capture"
# Main thread runs the capture loop (and, on the E8 ISP+JPEG target, the ISP /
# JPEG library calls), so give it comfortable headroom.
CONFIG_MAIN_STACK_SIZE=4096

# The UVC class streams frames from its own buffer pool
# (CONFIG_USBD_VIDEO_NUM_BUFS); this pool serves the control endpoint and the
# USB device stack. The defaults have ample headroom for the control traffic.
CONFIG_UDC_BUF_POOL_SIZE=8192
CONFIG_UDC_BUF_COUNT=16

# Quiet the USB stack - keep warnings/errors but drop the per-transfer INFOs.
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_LOG_LEVEL_ERR=y

# Keep the video drivers (CPI / ISP / JPEG) at warning level. Raise to
# CONFIG_VIDEO_LOG_LEVEL_DBG=y only when diagnosing a capture-side issue - the
# ISP logs several messages per frame at debug level.
CONFIG_VIDEO_LOG_LEVEL_WRN=y
