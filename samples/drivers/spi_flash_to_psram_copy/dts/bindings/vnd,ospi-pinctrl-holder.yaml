# Placeholder node that only carries an OSPI0 pinctrl state so the loader can
# own a pinctrl_dev_config (via PINCTRL_DT_DEFINE) and apply the state at run
# time. Including pinctrl-device.yaml is what makes gen_defines type the
# `pinctrl-0` property as phandles (otherwise the pinctrl phandle/child macros
# are not emitted for the node).

description: OSPI pinctrl state holder (no driver, runtime pin switching only)

compatible: "vnd,ospi-pinctrl-holder"

include: [pinctrl-device.yaml]
