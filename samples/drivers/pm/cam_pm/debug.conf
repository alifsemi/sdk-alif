# Extra instrumentation for tracing the post-S2RAM camera bring-up.
# Build with: -DEXTRA_CONF_FILE=debug.conf
#
# Not for normal runs: immediate logging serialises every message onto the
# UART from the calling context, which noticeably changes timing.

# Immediate logging must stay OFF on this SoC. The console UART sits in
# power_domain_syst, which S2RAM powers down, and there are log call sites on
# the far side of that cut -- power_domain_alif.c emits "Disabled power domain"
# *after* the domain is already gone. In immediate mode that reaches
# uart_ns16550_poll_out, which spins forever on a transmit-ready bit an
# unpowered UART never sets, with interrupts locked. Deferred logging buffers
# instead and the log thread drains it after resume, which is what makes the
# rest of the PM path safe.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_IMMEDIATE=n

# "Disabled power domain N" is INF, but the matching enable and the refcounts
# are DBG only, so the resume side is currently invisible.
CONFIG_POWER_DOMAIN_LOG_LEVEL_DBG=y

# Per-device suspend/resume transitions and their return codes.
CONFIG_PM_DEVICE_LOG_LEVEL_WRN=n
CONFIG_PM_DEVICE_LOG_LEVEL_DBG=y

# Which state the policy picked, and the residency it was offered.
#CONFIG_PM_LOG_LEVEL_DBG=y

# ISP/CPI internals: FIFO moves, stream start/stop, aborted buffers.
CONFIG_VIDEO_LOG_LEVEL_INF=n
CONFIG_VIDEO_LOG_LEVEL_DBG=y
