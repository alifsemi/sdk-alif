sample:
  name: Alif M55-HE A32 cluster power-off
  description: >
    M55-HE asks Linux/TF-A to power down the A32 cluster over MHU0,
    then enters PM_STATE_SUSPEND_TO_RAM STANDBY so es1_ppu can drop.
    Uses the same SE run/off profile helpers as the system_off sample.
common:
  tags:
    - power
    - pm
    - ipm
    - counter
    - rtc
    - drivers
  filter: SOC_FAMILY_ENSEMBLE
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "A32 off then HE S2RAM"
      - "A32/PD9 OFF"
      - "Resumed from PM_STATE_SUSPEND_TO_RAM"
tests:
  sample.pm.m55_he_a32_pm:
    platform_allow:
      - alif_e7_dk_rtss_he
      - alif_e8_dk_rtss_he
    integration_platforms:
      - alif_e8_dk_rtss_he
    depends_on:
      - counter
      - ipm
    extra_args:
      - SNIPPET=pm-a32-off-he
