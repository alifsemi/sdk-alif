sample:
  name: Alif ADC Power Management Demo
  description: >
    Demonstrates ADC temperature sampling across Zephyr power management
    states (PM_STATE_RUNTIME_IDLE, PM_STATE_SUSPEND_TO_IDLE,
    PM_STATE_SUSPEND_TO_RAM, PM_STATE_SOFT_OFF) on Alif RTSS cores.
common:
  tags:
    - power
    - pm
    - adc
    - counter
    - rtc
    - drivers
  filter: SOC_FAMILY_ENSEMBLE or SOC_FAMILY_BALLETTO
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "PM states demo"
      - "POWER STATE SEQUENCE"
      - "Current temp"
tests:
  sample.pm.adc_pm:
    platform_allow:
      - alif_e7_dk_rtss_he
      - alif_e1c_dk_rtss_he
      - alif_b1_dk_rtss_he
      - alif_e8_dk_rtss_he
    integration_platforms:
      - alif_e7_dk_rtss_he
    depends_on:
      - counter
      - adc
