sample:
  name: Alif ADC Power Management Demo
  description: >
    Demonstrates Zephyr power management states (PM_STATE_RUNTIME_IDLE,
    PM_STATE_SUSPEND_TO_IDLE, PM_STATE_SUSPEND_TO_RAM, PM_STATE_SOFT_OFF)
    for Alif RTSS cores with ADC12 temperature-sensor conversions between
    PM state transitions. PM states exercised are selected via build
    snippets: adc-pm-s2ram-tcm (HE TCM retention) and adc-pm-mram
    (MRAM boot SOFT_OFF, HE or HP).
common:
  tags:
    - power
    - pm
    - adc
    - counter
    - rtc
    - drivers
  filter: SOC_FAMILY_ENSEMBLE or SOC_FAMILY_BALLETTO
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "ADC PM demo"
      - "POWER STATE SEQUENCE"
tests:
  sample.drivers.adc.pm.s2ram_tcm:
    platform_allow:
      - alif_e7_dk_rtss_he
      - alif_e8_dk_rtss_he
      - alif_e1c_dk_rtss_he
      - alif_b1_dk_rtss_he
    integration_platforms:
      - alif_e7_dk_rtss_he
    depends_on:
      - counter
      - adc
    extra_args:
      - SNIPPET=adc-pm-s2ram-tcm
  sample.drivers.adc.pm.mram:
    platform_allow:
      - alif_e7_dk_rtss_he
      - alif_e7_dk_rtss_hp
      - alif_e8_dk_rtss_he
      - alif_e8_dk_rtss_hp
      - alif_e1c_dk_rtss_he
      - alif_b1_dk_rtss_he
    integration_platforms:
      - alif_e7_dk_rtss_he
      - alif_e7_dk_rtss_hp
    depends_on:
      - counter
      - adc
    extra_args:
      - SNIPPET=adc-pm-mram
