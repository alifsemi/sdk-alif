sample:
  name: Alif I2C DW Power Management Demo
  description: >
    Demonstrates Zephyr power management states combined with I2C DW
    master/target loopback on Alif RTSS cores. I2C0 is master and I2C1
    is slave. Each wake runs one write plus one read and compares the
    echoed data.
common:
  tags:
    - power
    - pm
    - i2c
    - drivers
  filter: SOC_FAMILY_ENSEMBLE or SOC_FAMILY_BALLETTO
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "I2C DW PM demo"
      - "POWER STATE SEQUENCE"
tests:
  sample.drivers.i2c_dw.pm.s2ram_tcm:
    platform_allow:
      - alif_e7_dk_rtss_he
      - alif_e8_dk_rtss_he
      - alif_e1c_dk_rtss_he
      - alif_b1_dk_rtss_he
    integration_platforms:
      - alif_e7_dk_rtss_he
    depends_on:
      - counter
    extra_args:
      - SNIPPET=i2c-dw-pm-s2ram-tcm
  sample.drivers.i2c_dw.pm.mram:
    platform_allow:
      - alif_e7_dk_rtss_he
      - alif_e7_dk_rtss_hp
      - alif_e8_dk_rtss_he
      - alif_e8_dk_rtss_hp
      - alif_e1c_dk_rtss_he
      - alif_b1_dk_rtss_he
    integration_platforms:
      - alif_e7_dk_rtss_he
      - alif_e7_dk_rtss_hp
    depends_on:
      - counter
    extra_args:
      - SNIPPET=i2c-dw-pm-mram
  sample.drivers.i2c_dw.pm.s2ram_sram0:
    platform_allow:
      - alif_e8_dk_rtss_he
      - alif_e8_dk_rtss_hp
    integration_platforms:
      - alif_e8_dk_rtss_he
    depends_on:
      - counter
    extra_args:
      - SNIPPET=i2c-dw-pm-s2ram-sram0
