sample:
  name: Alif PDM Power Management Demo
  description: >
    Demonstrates Zephyr power management states (PM_STATE_RUNTIME_IDLE,
    PM_STATE_SUSPEND_TO_IDLE, PM_STATE_SUSPEND_TO_RAM, PM_STATE_SOFT_OFF)
    for Alif RTSS cores with PDM microphone capture between PM state
    transitions. PM states exercised are selected via build snippets:
    pdm-pm-s2ram-tcm (HE TCM retention) and pdm-pm-mram (MRAM boot SOFT_OFF,
    HE or HP).
common:
  tags:
    - power
    - pm
    - pdm
    - counter
    - rtc
    - drivers
  filter: SOC_FAMILY_ENSEMBLE or SOC_FAMILY_BALLETTO
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "PDM PM demo"
      - "POWER STATE SEQUENCE"
tests:
  sample.drivers.pdm.pm.s2ram_tcm:
    platform_allow:
      - alif_e7_dk_rtss_he
      - alif_e8_dk_rtss_he
      - alif_e1c_dk_rtss_he
      - alif_b1_dk_rtss_he
    integration_platforms:
      - alif_e7_dk_rtss_he
    depends_on:
      - counter
      - pdm
    extra_args:
      - SNIPPET=pdm-pm-s2ram-tcm
  sample.drivers.pdm.pm.mram:
    platform_allow:
      - alif_e7_dk_rtss_he
      - alif_e7_dk_rtss_hp
      - alif_e8_dk_rtss_he
      - alif_e8_dk_rtss_hp
      - alif_e1c_dk_rtss_he
      - alif_b1_dk_rtss_he
    integration_platforms:
      - alif_e7_dk_rtss_he
      - alif_e7_dk_rtss_hp
    depends_on:
      - counter
      - pdm
    extra_args:
      - SNIPPET=pdm-pm-mram
