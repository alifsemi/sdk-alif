# Use with a platform UVC overlay after the camera configuration.

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_VIDEO_CLASS=y
CONFIG_SAMPLE_USBD_PID=0x0009
CONFIG_SAMPLE_USBD_PRODUCT="Alif Object Detection"

# Stream YUY2 for broad UVC host support.
CONFIG_AIPL_CONVERT_RGB888_TO_YUY2=y

CONFIG_UDC_BUF_POOL_SIZE=8192
CONFIG_UDC_BUF_COUNT=16

# Keep only USB warnings and errors.
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_LOG_LEVEL_ERR=y

# Align LVGL updates to two-pixel YUY2 pairs.
CONFIG_LVGL=y
CONFIG_DISPLAY=y
CONFIG_CDC200=n
CONFIG_MIPI_DSI=n
CONFIG_LV_Z_AREA_X_ALIGNMENT_WIDTH=2
CONFIG_AIPL_CONVERT_RGB565_TO_YUY2=y
