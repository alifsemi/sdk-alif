# OV5640 parallel camera on the Alif E1C StarterKit (LP-CPI / lpcam).
# The sensor outputs processed RGB565 at 320x240. Two capture buffers are used
# so the LP-CPI queue never drains (which would power the sensor down and stall
# the pipeline after the first frame). Each 320x240 RGB565 frame is
# 320*240*2 = 153600 bytes; the per-buffer pool slot is rounded up to 160 KiB
# to leave room for alignment/heap overhead, giving a 320 KiB non-secure pool.
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=163840
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2

# The E1C StarterKit gates the parallel camera buffer supply through the
# cam_enbuf fixed regulator, so the regulator subsystem must be enabled.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# ---------------------------------------------------------------------------
# Headless build for the E1C StarterKit.
#
# The E1C StarterKit has no MIPI-DSI display panel and a DTCM-only memory map
# (no SRAM0/SRAM1). Disable the display/LVGL UI stack so the object detection
# pipeline runs headless and its buffers fit in DTCM.
# ---------------------------------------------------------------------------
CONFIG_DISPLAY=n
CONFIG_LVGL=n
CONFIG_MIPI_DSI=n
CONFIG_CDC200=n

# Re-home the TFLM tensor arena into DTCM (.bss). Size must be at least the
# model's activation requirement (0x82000 per the MLEK usecase default); a
# smaller arena makes AllocateTensors()/model.Init() fail.
CONFIG_ACTIVATION_BUF_SECTION=".bss.activation_buf"
CONFIG_ACTIVATION_BUF_SZ=0x82000

# The OV5640 delivers RGB565; the detector needs RGB888. Enable the AIPL
# RGB565->RGB888 color conversion routine, otherwise aipl_color_convert()
# returns AIPL_ERR_UNSUPPORTED_FORMAT (error code 3). Only RGB565->ARGB8888
# is enabled by default.
CONFIG_AIPL_CONVERT_RGB565_TO_RGB888=y
