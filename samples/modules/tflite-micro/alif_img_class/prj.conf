# EXAMPLE
# Reduce MRAM offset from default 2MB to 512KB
# This gives ~5MB of MRAM instead of 3.5MB, needed for large ML model
CONFIG_FLASH_LOAD_OFFSET=0x80000

# VIDEO
CONFIG_VIDEO=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_I2C_TARGET=y
CONFIG_I2C=y
CONFIG_I2C_DW_CLOCK_SPEED=100
CONFIG_SYS_HEAP_AUTO=y

# AIPL
CONFIG_AIPL=y
CONFIG_AIPL_HELIUM_ACCELERATION=y
CONFIG_AIPL_DAVE2D_ACCELERATION=n

# k_malloc
CONFIG_HEAP_MEM_POOL_SIZE=16384

# tensorflow lite micro
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_TENSORFLOW_LITE_MICRO=y

# LVGL
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_LV_DEF_REFR_PERIOD=16
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
# Partial-mode draw buffer. D/AVE 2D writes it as a bus master, so it is linked
# into SRAM0 (.lvgl_buf, see lvgl_sram.ld) instead of DTCM.
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y
CONFIG_LV_Z_VDB_ALIGN=64
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
CONFIG_DAVE2D=y
CONFIG_LV_USE_DRAW_DAVE2D=y
CONFIG_LV_DRAW_SW_ASM_HELIUM=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_32=y
CONFIG_LV_THEME_DEFAULT_DARK=y

# DISPLAY
CONFIG_DISPLAY=y
CONFIG_MIPI_DSI=y
CONFIG_APP_DISPLAY_DIRECT_MODE=n

# Apply the GT911 touch reset-hold gpio-hog defined in the board overlays so the
# unused touch controller cannot collide with the camera on i2c1.
CONFIG_GPIO_HOGS=y

# arm_math.h
CONFIG_CMSIS_DSP=y

CONFIG_MLEK_EXAMPLES_LIB=y

# std::exp
CONFIG_NEWLIB_LIBC=y

# Minimum stack size
CONFIG_MAIN_STACK_SIZE=8192

# For debugging
CONFIG_LOG=y
# CONFIG_VIDEO_LOG_LEVEL_DBG=y
# CONFIG_LOG_MODE_IMMEDIATE=y

# lvlgl specific logging and assertions
# CONFIG_LV_USE_LOG=y
# CONFIG_LV_USE_ASSERT_STYLE=y
# CONFIG_LV_USE_ASSERT_MEM_INTEGRITY=y
# CONFIG_LV_USE_ASSERT_OBJ=y
