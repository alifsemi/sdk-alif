CONFIG_SYSTEM_HEAP_SRAM0=y
CONFIG_LPGPIO_WAKEUP_SOURCE=0
CONFIG_ACTIVATION_BUF_SECTION="SRAM0.activation_buf"
CONFIG_I2S=y
CONFIG_AUDIO_DMIC=y
CONFIG_ACTIVATION_BUF_SZ=0x200000

CONFIG_PM=n

# Application-kit hardware uses MXIC MX66UW OSPI profile.
CONFIG_OSPI_FLASH_IS25WX=n
CONFIG_OSPI_FLASH_MX66UW=y
