CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Executorch library
CONFIG_MLEK_EXAMPLES_LIB=y
CONFIG_EXECUTORCH=y
CONFIG_ARM_ETHOS_U=y
# Build the ExecuTorch Arm Ethos-U delegate backend (EthosUBackend); see Kconfig.
CONFIG_ETHOS_U=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# std::exp
CONFIG_NEWLIB_LIBC=y
CONFIG_SYS_HEAP_SMALL_ONLY=y

# Use display. This enabled also the LVGL graphics library and
# display driver to show ASR results on the on-board display.
CONFIG_ENABLE_DISPLAY=y

# LVGL
CONFIG_LV_Z_MEM_POOL_SIZE=49152
# Relocate LVGL rendering buffers (.lvgl_buf) and memory pool (.lvgl_heap) out of
# DTCM into SRAM0 (see lvgl_sram.ld).
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_32=y
CONFIG_LV_THEME_DEFAULT_DARK=y

# DISPLAY
CONFIG_MIPI_DSI=y

# arm_math.h
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=3

# Audio input
CONFIG_AUDIO=y

#########
CONFIG_ASSERT=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# joystick button
CONFIG_GPIO=y
CONFIG_LPGPIO_M55_IRQ_ENABLED=y

# ASR model is large, so we need to store it in external flash
CONFIG_MODEL_IN_EXT_FLASH=y
CONFIG_ALIF_OSPI_FLASH_XIP=y
CONFIG_OSPI_FLASH_IS25WX=y
CONFIG_OSPI=y
CONFIG_OSPI_FLASH=y
CONFIG_USE_ALIF_HAL_OSPI=y
