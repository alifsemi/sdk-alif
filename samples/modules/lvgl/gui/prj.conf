# Display pipeline: CDC200 controller + MIPI-DSI host + MW405 panel.
CONFIG_DISPLAY=y
CONFIG_MIPI_DSI=y

# LVGL core.
CONFIG_LVGL=y

# Widgets used by the exported UI (ui/screen_main.xml -> src/ui_xml.c). Most
# default to y in the LVGL Kconfig; set them explicitly so the sample is
# self-contained and does not silently drop a widget if a default changes.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_CHECKBOX=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_LED=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_IMAGE=y

# Fonts used by the UI (montserrat_14 is the default font; 24 is used for the
# title label).
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_24=y

# Flexbox layout used by the root container in the exported UI.
CONFIG_LV_USE_FLEX=y

# Refresh at ~60 FPS (LVGL default is 33 ms / ~30 FPS).
CONFIG_LV_DEF_REFR_PERIOD=16

# LVGL memory pool. Every lv_malloc() comes from here: widget objects, the
# simple-layer scratch buffers and the transient glyph bitmaps lv_draw_label
# allocates per letter. It lives in .lvgl_heap (SRAM0).
CONFIG_LV_Z_MEM_POOL_SIZE=524288
CONFIG_LV_DRAW_LAYER_SIMPLE_BUF_SIZE=49152

# Double-buffered, statically allocated rendering buffers. The custom sections
# (.lvgl_buf / .lvgl_heap) are relocated to globally-addressable SRAM0 by
# lvgl_sram.ld so the D/AVE 2D GPU can render into them and the VDBs can also
# serve as the CDC200 scan-out framebuffers (DIRECT mode zero-copy page-flip).
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y

# Size the VDBs for the RGB565 panel (16 bpp). The Zephyr LVGL Kconfig has an
# unconditional "default 32" before the "default 16 if LV_COLOR_DEPTH_16"
# entry, so pin the bits-per-pixel explicitly.
CONFIG_LV_Z_BITS_PER_PIXEL=16

# DIRECT-mode rendering: two full-screen VDBs in SRAM0 ARE the scan-out
# framebuffers. main.c page-flips via cdc200_swap_fb() at vsync.
CONFIG_LV_Z_VDB_SIZE=100

# Offload LVGL rendering to the D/AVE 2D GPU.
CONFIG_DAVE2D=y
CONFIG_LV_USE_DRAW_DAVE2D=y

# Use the Cortex-M55 Helium (MVE) software-render backend for the operations the
# D/AVE 2D unit cannot offload, instead of scalar C.
CONFIG_LV_DRAW_SW_ASM_HELIUM=y

# Build for speed (-O2). There is ample MRAM headroom for the larger code.
CONFIG_SPEED_OPTIMIZATIONS=y

# 16-bit colour depth to match the RGB565 panel.
CONFIG_LV_COLOR_DEPTH_16=y

# Kernel heap used by the MIPI-DSI / panel drivers.
CONFIG_HEAP_MEM_POOL_SIZE=81920

CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y
