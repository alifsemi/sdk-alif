# Extra Kconfig for the E8 DK MT9M114 build. Pass with OVERLAY_CONFIG alongside
# the MT9M114 DTC overlay (see README). The E8 board .conf (ISP lib + JPEG +
# buffer pool) is applied automatically by board name and still holds.

# The MT9M114 here is used on the MIPI CSI-2 (serial) path, not the parallel
# bus. This must be off: with it on the driver drops its higher-resolution CSI
# modes (including the Y10P 1288x728 ISP input this sample uses).
CONFIG_MT9M114_PARALLEL_INIT=n

# The MT9M114 MIPI supply is a fixed regulator (see the overlay). REGULATOR is a
# top-level menuconfig and is not auto-selected by the devicetree node, so
# enable it (and give the fixed regulator an early init priority so the sensor
# is powered before it is probed).
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_INIT_PRIORITY=40

# Apply the GT911 touch reset-hold GPIO hog from the MT9M114 overlay. The MW405
# display's GT911 touch controller shares i2c1 and has the same address (0x5D)
# as the MT9M114; holding it in reset stops it colliding with the camera.
CONFIG_GPIO_HOGS=y

# Video buffer pool for the 1280x720 pipeline (overrides the E8 board .conf,
# which is sized for the 480x480 ARX3A0 default). The pool holds TWO NV12
# 1280x720 frames (2 x 1280*720*1.5 = 2,764,800 B - two are needed so the ISP
# keeps capturing while one frame is JPEG-encoded and sent) plus the JPEG output
# buffer (width*height = 921,600 B). That is three allocations totalling
# ~3.69 MB, so NUM_MAX must be >= 3. SZ_MAX x NUM_MAX is the total heap:
# 1,250,000 x 3 = 3.75 MB holds all three with headroom and fits SRAM0 (4 MB).
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=1250000
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3
