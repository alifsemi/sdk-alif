# USB Device Stack (next-gen)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1

# USB Logging
CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_MSC_LOG_LEVEL_WRN=y

# USB Device Descriptors
CONFIG_SAMPLE_USBD_PID=0x0008
CONFIG_SAMPLE_USBD_PRODUCT="USBD MSC sample"

# Disk and File system
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# FATFS options
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=512
CONFIG_FS_FATFS_LFN=y

# SDHC
CONFIG_SDHC=y
CONFIG_SDHC_DWC=y
CONFIG_SDHC_DWC_ADMA=y
CONFIG_SDHC_RSP_136_HAS_CRC=y
CONFIG_SDHC_LOG_LEVEL_INF=y

# Regulator < SDHC Init priority <= USB
CONFIG_SDHC_INIT_PRIORITY=80

# SD Power
CONFIG_REGULATOR=y

# Ztest framework
CONFIG_ZTEST=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
