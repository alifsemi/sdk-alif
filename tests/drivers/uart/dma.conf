# DMA-specific configuration for the UART DMA async-API test suite.
#
# Kept separate from prj.conf so that the DMA / async-API options do not
# affect the non-DMA UART test suites. Disables the interrupt-driven
# internal-loopback suite so it does not share zephyr,devnode1 with the
# DMA suite.

CONFIG_UART_ASYNC_API=y
CONFIG_DMA=y
CONFIG_DMA_PL330=y
CONFIG_TEST_UART_DMA=y
CONFIG_TEST_INTERNAL_LB=n
