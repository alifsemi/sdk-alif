common:
  tags:
    - drivers
    - uart
  harness: ztest
  timeout: 600
  platform_allow:
    - alif_b1_dk/ab1c1f4m51820ph0/rtss_he
    - alif_e1c_dk/ae1c1f4051920hh/rtss_he
    - alif_e8_dk/ae822fa0e5597xx0/rtss_he
    - alif_e8_dk/ae822fa0e5597xx0/rtss_hp
    - alif_e7_dk/ae722f80f55d5xx/rtss_he
    - alif_e7_dk/ae722f80f55d5xx/rtss_hp
  integration_platforms:
    - alif_e8_dk/ae822fa0e5597xx0/rtss_he

tests:
  drivers.uart:
    extra_dtc_overlay_files:
      - boards/alif_uart.overlay
    extra_configs:
      - CONFIG_TEST_INTERNAL_LB=y

  drivers.uart.rtscts:
    extra_args:
      - SNIPPET=uart0-rts-cts
    extra_dtc_overlay_files:
      - boards/alif_uart.overlay
    extra_configs:
      - CONFIG_TEST_UART_RTSCTS=y
      - CONFIG_TEST_INTERNAL_LB=n

  drivers.uart.dma:
    extra_args:
      - EXTRA_CONF_FILE=dma.conf
      - SNIPPET=alif-uart-dma
    extra_configs:
      - CONFIG_TEST_UART_DMA=y
      - CONFIG_TEST_INTERNAL_LB=n
