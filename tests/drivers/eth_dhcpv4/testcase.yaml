common:
  tags:
    - net
    - dhcpv4
    - ethernet
    - alif
  depends_on: netif
  harness: ztest
  timeout: 900
  # Ethernet/MDIO/PHY nodes stay disabled in the SoC DT; twister must apply
  # the same snippet as west -S (samples/net/dhcpv4_client).
  extra_args:
    - SNIPPET=alif-dhcpv4-client
  # Real-hardware test: needs the board cabled to a LAN with an active
  # DHCP server. Not runnable on emulation/CI, only on physical Alif DevKits.
  platform_allow:
    - alif_e7_dk/ae722f80f55d5xx/rtss_he
    - alif_e7_dk/ae722f80f55d5xx/rtss_hp
    - alif_e8_dk/ae822fa0e5597xx0/rtss_he
    - alif_e8_dk/ae822fa0e5597xx0/rtss_hp
tests:
  net.alif.ethernet.dhcpv4:
    # Validates the real Alif DWMAC + RTL8201FR PHY DHCPv4 client path.
    slow: true
