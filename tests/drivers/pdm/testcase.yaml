# Representative PDM / LpPDM scenarios. Not exhaustive — see README.rst.
# ZTEST name: test_pdm_*   for -S pdm   (&pdm)
#             test_lppdm_* for -S lppdm (&lppdm)
common:
  tags: pdm
  harness: ztest
  timeout: 90

.pdm_platforms: &pdm_platforms
  - alif_e8_dk/ae822fa0e5597xx0/rtss_he
  - alif_e8_dk/ae822fa0e5597xx0/rtss_hp
  - alif_e7_dk/ae722f80f55d5xx/rtss_he
  - alif_e7_dk/ae722f80f55d5xx/rtss_hp

.lppdm_platforms: &lppdm_platforms
  - alif_b1_dk/ab1c1f4m51820hh0/rtss_he
  - alif_e1c_dk/ae1c1f4051920hh/rtss_he
  - alif_e8_dk/ae822fa0e5597xx0/rtss_he
  - alif_e7_dk/ae722f80f55d5xx/rtss_he

tests:
  # --- PDM: E7/E8 HE + HP ---
  drivers.pdm.mono.mode1.ch0:
    required_snippets:
      - pdm
    platform_allow: *pdm_platforms
    integration_platforms: *pdm_platforms
    extra_configs:
      - CONFIG_TEST_PDM_MONO_CH=y
      - CONFIG_TEST_PDM_CH0=y
      - CONFIG_TEST_PDM_MODE1=y
  drivers.pdm.mono.mode2.ch3:
