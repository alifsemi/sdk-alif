# Twister definitions for the Alif I2S power-management ztest.

common:
  tags:
    - drivers
    - i2s
    - pm
    - power
    - rtc
  harness: ztest
  timeout: 600
  depends_on:
    - counter
    - i2s

tests:
  drivers.pm.i2s.he:
    extra_args:
      - SNIPPET=i2s-pm-he
    platform_allow:
      - alif_e7_dk_rtss_he
      - alif_e8_dk_rtss_he
    integration_platforms:
      - alif_e8_dk_rtss_he
  drivers.pm.i2s.hp:
    extra_args:
      - SNIPPET=i2s-pm-hp
    platform_allow:
      - alif_e7_dk_rtss_hp
