CONFIG_PM=y
# CONFIG_POWEROFF=y
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_COUNTER=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_ASSERT=y

# Logging Configuration - Only for this application
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_PM_DEVICE_LOG_LEVEL_DBG=y

CONFIG_PM_DEVICE=y
CONFIG_POWER_DOMAIN=y
CONFIG_PM_S2RAM=y
CONFIG_PM_SAU_SAVE_RESTORE=y

# CONFIG_ALIF_POWER_MGR_LIB=n

CONFIG_SPI=y
CONFIG_SPI_DW=y
CONFIG_SPI_LOG_LEVEL_INF=y
CONFIG_SPI_LOG_LEVEL_DBG=n
CONFIG_SPI_SLAVE=y

CONFIG_ZTEST=y
