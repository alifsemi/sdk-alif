CONFIG_PM_S2RAM=y
CONFIG_PM_SAU_SAVE_RESTORE=y

# Stop/standby run on the idle thread (SE off-profile plus device suspend).
# The ARM+FPU default is 320 bytes, which overflows on that path. The PDM PM
# sample uses 1024 and returns from the same stop.
CONFIG_IDLE_STACK_SIZE=1024

# Deferred logs stay in the ring buffer during suspend, while the UART is off.
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_DMA=y
CONFIG_DMA_PL330=y
CONFIG_ALIF_PDM_USE_DMA=y
