common:
  harness: ztest
  depends_on: wifi
  tags:
    - net
    - wifi
  platform_allow:
    - alif_e8_dk/ae822fa0e5597xx0/rtss_hp
    - alif_e7_dk/ae722f80f55d5xx/rtss_hp
    - alif_e8_ak/ae822fa0e5597xx0/rtss_hp
  integration_platforms:
    - alif_e8_dk/ae822fa0e5597xx0/rtss_hp
    - alif_e7_dk/ae722f80f55d5xx/rtss_hp

tests:
  net.wifi.shell.1yn:
    extra_args:
      - OVERLAY_CONFIG="overlay-shell.conf;1yn.conf"
    timeout: 600
    integration_platforms:
      - alif_e8_dk/ae822fa0e5597xx0/rtss_hp
      - alif_e7_dk/ae722f80f55d5xx/rtss_hp
    tags:
      - shell
      - 1yn
  net.wifi.shell.2fy:
