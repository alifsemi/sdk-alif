# Controller image. The target is optional: tests that need it skip.
CONFIG_TEST=y
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
# Suite setup and teardown run on main, and one exchange uses two frame buffers.
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_I3C=y
CONFIG_I3C_USE_IBI=y
CONFIG_I3C_IBI_MAX_PAYLOAD_SIZE=16
CONFIG_I3C_NUM_OF_DESC_MEM_SLABS=4
CONFIG_I3C_TEST_CONTROLLER=y

# Sensor support for BMI323 and ICM42670 tests
CONFIG_SENSOR=y
CONFIG_BMI323=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_HEAP_MEM_POOL_SIZE=1024
