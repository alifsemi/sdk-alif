common:
  tags:
    - drivers
    - i3c
    - target
  extra_conf_files:
    - prj.conf
  build_only: true
  platform_allow:
    - alif_e1c_dk/ae1c1f4051920hh/rtss_he
    - alif_b1_dk/ab1c1f4m51820hh0/rtss_he

tests:
  drivers.i3c.target.e7:
    platform_allow:
      - alif_e7_dk/ae722f80f55d5xx/rtss_he
      - alif_e7_dk/ae722f80f55d5xx/rtss_hp
    extra_dtc_overlay_files:
      - boards/alif_e7_i3c.overlay
    extra_configs:
      - CONFIG_I3C_TEST_TARGET=y
    integration_platforms:
      - alif_e8_dk/ae822fa0e5597xx0/rtss_hp

  drivers.i3c.target.e8:
