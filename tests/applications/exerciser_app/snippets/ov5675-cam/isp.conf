CONFIG_USE_ALIF_ISP_LIB=y
CONFIG_ISP_LIB_SCALAR_MODULE=y
CONFIG_ISP_LIB_DMSC_MODULE=y
CONFIG_ISP_LIB_CSM_MODULE=y
CONFIG_ISP_LIB_CCM_MODULE=n
CONFIG_ISP_LIB_WBM_MODULE=n
CONFIG_ISP_LIB_WB_MODULE=n

CONFIG_VIDEO_ALIF_CAM_EXTENDED=y

# Camera
CONFIG_VIDEO=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_I2C_TARGET=y
CONFIG_I2C=y    #needed for both cam and codec
CONFIG_I2C_DW_CLOCK_SPEED=100
CONFIG_SYS_HEAP_AUTO=y
CONFIG_VIDEO_LOG_LEVEL_DBG=n
CONFIG_GPIO=y
# AIPL (Alif Image Processing Library) - for HW-accelerated color conversion
CONFIG_AIPL=y
CONFIG_AIPL_COLOR_CONVERSION=y
CONFIG_AIPL_CONVERT_I420=y
CONFIG_AIPL_CONVERT_I420_TO_RGB565=y
CONFIG_AIPL_DEMOSAICING=y
CONFIG_AIPL_HELIUM_ACCELERATION=y
CONFIG_DAVE2D=n
CONFIG_AIPL_DAVE2D_ACCELERATION=n
# Display
CONFIG_DISPLAY=y
CONFIG_MIPI_DSI=y
CONFIG_HEAP_MEM_POOL_SIZE=81920

#sd
# E8 dev kit specific configs
CONFIG_SDHC_INIT_PRIORITY=80
CONFIG_ETH_INIT_PRIORITY=85

# # Optional SD UHS (voltage switching support on E8 DK)
# # All Card doesn't support 1.8v
CONFIG_SD_UHS_PROTOCOL=n

# # # Regulator (for SD power)
CONFIG_REGULATOR=y

# CONFIG_DEBUG=y
# CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_NO_OPTIMIZATIONS=y
# #CONFIG_MAIN_STACK_SIZE=4096
# CONFIG_LOG_PRINTK=y

#FATFS
# CONFIG_FS_SAMPLE_CREATE_SOME_ENTRIES=y
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=512
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_LOG_LEVEL_INF=y

#SDHC LOG
CONFIG_SDHC_LOG_LEVEL_INF=y

#SDHC DWC
CONFIG_SDHC_RSP_136_HAS_CRC=y
CONFIG_SDHC_DWC=y
CONFIG_SDHC_DWC_ADMA=y

#SD Core
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

#eth
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_DNS_RESOLVER=y

CONFIG_TEST_RANDOM_GENERATOR=y

#CONFIG_INIT_STACKS=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

CONFIG_NET_LOG=y
CONFIG_LOG=y

CONFIG_SLIP_STATISTICS=n
#CONFIG_NET_SHELL=y

CONFIG_ALIF_NET_PKT_SRAM0=n
CONFIG_SYSTEM_HEAP_SRAM0=y
CONFIG_INIT_STACKS=n
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8

CONFIG_SD_BUFFER_SECTION=".alif_sram0"
CONFIG_SDHC_DESCRIPTOR_SECTION=".alif_sram0"

#codec_passthrough

CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_I2S=y
CONFIG_SAMPLE_FREQ=48000
CONFIG_AUDIO_CODEC_WM8904=y
