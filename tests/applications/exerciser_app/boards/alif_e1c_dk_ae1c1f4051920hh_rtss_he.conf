CONFIG_GPIO=y
CONFIG_SHELL=y
#ospi

CONFIG_STDOUT_CONSOLE=y
CONFIG_FLASH=y
CONFIG_OSPI_FLASH_IS25WX=y
CONFIG_ARM_MPU=y
CONFIG_CPU_HAS_CUSTOM_FIXED_SOC_MPU_REGIONS=y
CONFIG_EVENTS=y

CONFIG_MAIN_STACK_SIZE=20480
CONFIG_FLASH_LOG_LEVEL_DBG=n
CONFIG_USE_ALIF_HAL_OSPI=y

#spi (LPSPI master internal loopback + DMA)
CONFIG_SPI=y
CONFIG_SPI_DW=y
CONFIG_SPI_LOG_LEVEL_INF=n
CONFIG_SPI_LOG_LEVEL_DBG=n
CONFIG_DMA=y
CONFIG_DMA_PL330=y
CONFIG_SPI_DW_USE_DMA=y
CONFIG_PRINTK=y
CONFIG_DMA_LOG_LEVEL_INF=n

#sd

#FATFS
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=512
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_LOG_LEVEL_ERR=y
CONFIG_FS_LOG_LEVEL_INF=y

#SDHC LOG
CONFIG_SDHC_LOG_LEVEL_INF=y
CONFIG_SDHC_LOG_LEVEL_ERR=y

#SDHC DMA
CONFIG_SDHC_RSP_136_HAS_CRC=y
CONFIG_SDHC_DWC=y
CONFIG_SDHC_DWC_ADMA=y

# B1/E1C dev kit specific configs
CONFIG_SDHC_INIT_PRIORITY=80
# Regulator (for SD power)
CONFIG_REGULATOR=y


#sd_org_prj
CONFIG_DISK_ACCESS=y
CONFIG_LOG=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

#usb-next
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_ERR=y
CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="USBD CDC ACM sample"

#codec_passthrough

CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_I2S=y
CONFIG_I2C=y
CONFIG_HEAP_MEM_POOL_SIZE=81920
CONFIG_SAMPLE_FREQ=48000
CONFIG_AUDIO_CODEC_WM8904=y


#bmi323
CONFIG_I3C=y
CONFIG_I3C_INIT_RSTACT=y
CONFIG_I3C_USE_IBI=n
CONFIG_SENSOR=y
CONFIG_CLOCK_CONTROL=y
CONFIG_FPU=y

